name: CI-e2e

on:
  pull_request:
    branches: [main, mq-e2e-base]
  push:
    branches: [main, mq-e2e-base]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run linter
        run: |
          echo "🔍 Running linter..."
          echo "Checking shell scripts..."
          sleep 2
          echo "✅ All files passed linting!"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          echo "🧪 Running unit tests..."
          sleep 3
          echo "  ✓ test_validate_labels"
          echo "  ✓ test_choose_candidate"
          echo "  ✓ test_merge_pr"
          echo "✅ All tests passed!"

      - name: Run integration tests
        run: |
          echo "🔗 Running integration tests..."
          sleep 2
          echo "  ✓ test_full_merge_flow"
          echo "  ✓ test_conflict_handling"
          echo "✅ Integration tests passed!"
