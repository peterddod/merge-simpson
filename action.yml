name: 'Merge Simpson'
description: 'A zero-config merge queue that manages PRs using labels and standard CI checks.'
author: 'Peter Dodd'

inputs:
  github-token:
    description: >-
      Token used for all writes (update branch, labels, merge). Use a GitHub App
      installation token or a fine-grained PAT: events caused by the default
      GITHUB_TOKEN do not trigger workflows, so branch updates get no CI and a
      promoted candidate is never woken up. Defaults to GITHUB_TOKEN, with a warning.
    required: false
    default: ${{ github.token }}
  label-queue:
    description: 'Label for queued PRs'
    required: false
    default: 'mq-queue'
  label-candidate:
    description: 'Label for the PR candidate used internally'
    required: false
    default: 'mq-candidate'

branding:
  icon: 'git-merge'
  color: 'yellow'

runs:
  using: "composite"
  steps:
    # ============================================================
    # DETERMINE PR NUMBER (handle different event types)
    # ============================================================
    - name: "Check token"
      if: inputs.github-token == github.token
      shell: bash
      run: |
        echo "::warning title=Merge Simpson::Running with the default GITHUB_TOKEN. Events it causes do not trigger workflows, so updated branches get no CI and newly promoted candidates are only picked up by the next event or scheduled run. Pass a GitHub App token or fine-grained PAT as 'github-token'."

    - name: "Get PR number from event"
      id: get-pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER_FROM_PR: ${{ github.event.pull_request.number }}
        PR_NUMBER_FROM_WORKFLOW_RUN: ${{ github.event.workflow_run.pull_requests[0].number }}
        PR_STATE_FROM_PR: ${{ github.event.pull_request.state }}
        WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          echo "pr_number=$PR_NUMBER_FROM_PR" >> "$GITHUB_OUTPUT"
          echo "pr_state=$PR_STATE_FROM_PR" >> "$GITHUB_OUTPUT"
          echo "📋 Event: pull_request, PR #$PR_NUMBER_FROM_PR, State: $PR_STATE_FROM_PR"
        elif [ "$EVENT_NAME" = "workflow_run" ]; then
          if [ -z "$PR_NUMBER_FROM_WORKFLOW_RUN" ]; then
            echo "📋 Event: workflow_run, not associated with a PR. Driving the queue."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "pr_state=" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR_NUMBER_FROM_WORKFLOW_RUN" >> "$GITHUB_OUTPUT"
            echo "pr_state=open" >> "$GITHUB_OUTPUT"
            echo "📋 Event: workflow_run, PR #$PR_NUMBER_FROM_WORKFLOW_RUN, Conclusion: $WORKFLOW_RUN_CONCLUSION"
          fi
        else
          echo "📋 Event: $EVENT_NAME, no triggering PR. Driving the queue."
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          echo "pr_state=" >> "$GITHUB_OUTPUT"
        fi

    # ============================================================
    # ON PR CLOSED
    # ============================================================
    - name: "[On PR Closed] Cleanup labels"
      if: steps.get-pr.outputs.pr_number != '' && steps.get-pr.outputs.pr_state == 'closed'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        LABEL_CANDIDATE: ${{ inputs.label-candidate }}
        LABEL_QUEUE: ${{ inputs.label-queue }}
      run: ${{ github.action_path }}/src/scripts/pr-cleanup-labels.sh

    # ============================================================
    # CHOOSE CANDIDATE (every event, whichever PR triggered the run)
    # ============================================================
    - name: "Validate/Fix/Choose candidate"
      id: candidate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        LABEL_CANDIDATE: ${{ inputs.label-candidate }}
        LABEL_QUEUE: ${{ inputs.label-queue }}
      run: ${{ github.action_path }}/src/scripts/validate-fix-choose-candidate.sh

    # ============================================================
    # ON PR UPDATE (opened, synchronize, labeled, unlabeled, workflow_run)
    # ============================================================
    - name: "[On PR Update] Cancel workflows if this PR is not the candidate"
      if: steps.get-pr.outputs.pr_number != '' && steps.get-pr.outputs.pr_state != 'closed'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        LABEL_CANDIDATE: ${{ inputs.label-candidate }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: ${{ github.action_path }}/src/scripts/pr-is-candidate.sh

    # ============================================================
    # DRIVE THE CANDIDATE (every event: update, wait for CI, merge)
    # ============================================================
    - name: "Update candidate branch if needed"
      id: update-branch
      if: steps.candidate.outputs.candidate != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.candidate.outputs.candidate }}
      run: ${{ github.action_path }}/src/scripts/update-branch.sh

    - name: "Check if candidate CI passed"
      id: ci-checks
      if: steps.candidate.outputs.candidate != '' && steps.update-branch.outputs.updated != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.candidate.outputs.candidate }}
      run: ${{ github.action_path }}/src/scripts/ci-checks-passed.sh

    - name: "Check if candidate is mergeable"
      id: is-mergeable
      if: steps.candidate.outputs.candidate != '' && steps.update-branch.outputs.updated != 'true' && steps.ci-checks.outputs.checks_passed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.candidate.outputs.candidate }}
        LABEL_CANDIDATE: ${{ inputs.label-candidate }}
      run: ${{ github.action_path }}/src/scripts/pr-is-mergeable.sh

    - name: "Merge candidate"
      id: merge-pr
      if: steps.candidate.outputs.candidate != '' && steps.update-branch.outputs.updated != 'true' && steps.is-mergeable.outputs.is_mergeable == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.candidate.outputs.candidate }}
        LABEL_CANDIDATE: ${{ inputs.label-candidate }}
        LABEL_QUEUE: ${{ inputs.label-queue }}
      run: ${{ github.action_path }}/src/scripts/merge-pr.sh

    - name: "Choose next candidate after merge"
      if: steps.merge-pr.outputs.merged == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        LABEL_CANDIDATE: ${{ inputs.label-candidate }}
        LABEL_QUEUE: ${{ inputs.label-queue }}
      run: ${{ github.action_path }}/src/scripts/choose-candidate.sh
